[package]
name = "yojaka-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
rusqlite.workspace = true
directories.workspace = true
uuid.workspace = true
time.workspace = true
blake3.workspace = true
libc.workspace = true
rayon.workspace = true
dua-core.workspace = true
zstd.workspace = true
kamadak-exif.workspace = true
imagesize.workspace = true
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSURL", "NSError", "NSString", "NSPathUtilities"] }
# ImageIO decodes HEIC, AVIF and raw photos for the similar duplicate tier (sys/imageio.rs).
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageProperties", "CGImageSource", "objc2-core-graphics"] }
unicode-normalization.workspace = true
reflink-copy = "0.1.32"
image.workspace = true

[dev-dependencies]
tempfile.workspace = true
insta.workspace = true
proptest.workspace = true
criterion.workspace = true
fixturegen = { path = "../../tools/fixturegen" }

[[bench]]
name = "baseline"
harness = false

[lints]
workspace = true
